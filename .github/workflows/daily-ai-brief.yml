name: Daily AI brief

on:
  schedule:
    - cron: "17 7 * * *"
      timezone: "Europe/London"
    - cron: "43 18 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-brief
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME || 'Vishnu Vardhan' }}
      GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL || '100158505+iamvishno@users.noreply.github.com' }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run quality checks
        run: python -m unittest discover -s tests -v

      - name: Generate today's brief
        env:
          PYTHONPATH: src
        run: python scripts/run_daily.py

      - name: Commit the validated update
        shell: bash
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add README.md daily data/state.json

          if git diff --cached --quiet; then
            echo "Today's brief already exists; no commit is needed."
            exit 0
          fi

          BRIEF_DATE="$(TZ=Europe/London date +%F)"
          git commit -m "docs(ai-news): add daily AI update for ${BRIEF_DATE}"
          git push
